<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BN letterform (BirdNion-style chunky rounded) -->
  <text x="256" y="330" text-anchor="middle" font-family="'Arial Rounded MT Bold','Arial Black',sans-serif" font-size="300" font-weight="900" fill="#16150f" letter-spacing="-14">BN</text>

  <!-- White halo behind swap arrows -->
  <g stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M168 214 h160 m0 0 l-26 -26 m26 26 l-26 26"/>
    <path d="M344 278 h-160 m0 0 l26 -26 m-26 26 l26 26"/>
  </g>

  <!-- Swap arrows: blue right + sun left -->
  <g stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M168 214 h160 m0 0 l-26 -26 m26 26 l-26 26" stroke="#4f80e8"/>
    <path d="M344 278 h-160 m0 0 l26 -26 m-26 26 l26 26" stroke="#f2bf38"/>
  </g>
</svg>
