<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ink tile, full bleed -->
  <rect width="512" height="512" fill="#16150f"/>

  <!-- BN letterform (paper-bright) -->
  <text x="256" y="358" text-anchor="middle" font-family="'Arial Rounded MT Bold','Arial Black',sans-serif" font-size="300" font-weight="900" fill="#fffefa" letter-spacing="-14">BN</text>

  <!-- Ink halo behind swap arrows -->
  <g stroke="#16150f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M158 240 h170 m0 0 l-26 -26 m26 26 l-26 26"/>
