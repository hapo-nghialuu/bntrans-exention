<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ink tile -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="#16150f"/>

  <!-- BN letterform (paper-bright) -->
  <text x="256" y="352" text-anchor="middle" font-family="'Arial Rounded MT Bold','Arial Black',sans-serif" font-size="290" font-weight="900" fill="#fffefa" letter-spacing="-14">BN</text>

  <!-- Ink halo behind swap arrows -->
